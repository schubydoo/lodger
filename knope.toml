# Release automation for Lodger: knope with the CHANGESETS model, ported from
# scratchsmith.
#
# Every user-facing change ships a `.changeset/*.md` fragment. The fragments, not
# commit messages, drive both the version bump and the changelog. `knope
# document-change` scaffolds one. Conventional-commit PR titles are still enforced
# (pr-title.yml) for a clean squash history, but ignored for release purposes.
#
# The release PR half lives in .github/workflows/knope-prepare.yml, and the
# publish half in knope-release.yml. Both wait for the `KNOPE_ENABLED` repo
# variable. The changeset reminder (changeset-check.yml) runs regardless, so
# fragments accumulate from the first code change.

[package]
# The workspace version in the root Cargo.toml. Anchored to line start so it hits
# `version = "X.Y.Z"` under [workspace.package] and not `rust-version` or the
# `{ version = "..." }` dependency pins. The crates inherit it with
# `version.workspace = true`. web/package.json carries the same version. It also
# uses a regex: as a plain JSON entry, knope rewrites the whole file with 2-space
# indents, and prettier then rejects the tabs it expects.
versioned_files = [
  { path = "Cargo.toml", regex = '(?m)^version = "(?<version>\d+\.\d+\.\d+)"' },
  { path = "web/package.json", regex = '(?m)^\t"version": "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"

# knope-release.yml builds, signs, and stages the archive, the SBOMs, the
# checksums, the signature, and the provenance in dist/release-assets/ before
# `knope release` runs. With `assets` set, the Release step creates the GitHub
# Release as a draft, uploads every file under this glob, and only then
# publishes it, which creates the tag. A fail-closed gate in knope-release.yml
# makes sure that the full signed set is there first: knope fails only on a
# globbed file that vanished, not on one that was never built.
assets = "dist/release-assets/*"

# A fragment's `default:` value picks both the changelog section and the version
# bump. A custom type bumps patch.
extra_changelog_sections = [
  { name = "Security", types = ["security"] },
  { name = "Performance", types = ["perf"] },
  { name = "Deprecated", types = ["deprecated"] },
]

[changes]
ignore_conventional_commits = true # fragments in .changeset/ are the sole source of truth

[github]
owner = "schubydoo"
repo = "lodger"

[release_notes]
change_templates = [
  "### $summary ([#$pr_number](https://github.com/schubydoo/lodger/pull/$pr_number))\n\n$details",
  "### $summary\n\n$details",
  "- $summary ([#$pr_number](https://github.com/schubydoo/lodger/pull/$pr_number))",
  "- $summary",
]

# --- prepare-release: open or refresh the `release` PR (run on push to main) ---
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "cargo update --workspace" # resync Cargo.lock to the bumped version

[[workflows.steps]]
type = "Command"
command = 'git commit -am "chore: prepare release $version"'

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this PR tags and publishes **v$version**.\n\nGenerated by knope from the `.changeset/*.md` fragments. Do not hand-edit.\n\n---\n\n$changelog"

# --- release: create the tag and GitHub Release on merge of the release PR ---
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

# --- document-change: scaffold a new .changeset fragment (local convenience) ---
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
