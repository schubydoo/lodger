[package]
name = "lodger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
ipnet = { version = "2.12.2", features = ["serde"] }
lodger-core.workspace = true
lodger-virt.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
base64 = "0.22.1"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }
tokio-rusqlite = "0.8.0"
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
