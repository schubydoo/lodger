# Lodger configuration. `lodger serve` reads this file at start.
# After a change, run: sudo systemctl restart lodger
# `lodger install` writes this file only if it does not exist.

# The address and port to listen on. Keep a loopback address unless TLS is
# on. For remote access, set tls_cert and tls_key below, or put a reverse
# proxy with TLS in front of Lodger.
listen = "127.0.0.1:8460"

# The libvirt connection.
uri = "qemu:///system"

# The URL that browsers use to open Lodger. Browsers without
# Sec-Fetch-Site can log in only when this is set.
# public_url = "https://lodger.lan"

# The proxies whose X-Forwarded-For header Lodger trusts.
# trusted_proxies = ["127.0.0.1/32"]

# Built-in TLS: the PEM certificate (with any intermediate certificates) and
# its private key. Set both or neither. The lodger user must be able to read
# them. With TLS on, a LAN address such as "192.168.1.10:8460" is safe.
# tls_cert = "/etc/lodger/tls/cert.pem"
# tls_key = "/etc/lodger/tls/key.pem"
