[workspace]
resolver = "3"
members = ["crates/lodger-core", "crates/lodger-virt", "crates/lodger"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/schubydoo/lodger"
publish = false

[workspace.dependencies]
lodger-core = { path = "crates/lodger-core" }
lodger-virt = { path = "crates/lodger-virt" }
# Reviewed main-branch commit, not a crates.io release. See docs/virt-pin.md
# before changing this pin. Renovate proposes new master commits (held for review)
# and watches crates.io: a PR for the release-watch line below means upstream
# released, so check whether the release contains this commit and move back.
# renovate: datasource=crate depName=virt-crates-io-release packageName=virt
# virt-crates-io-release-watch = "0.4.3"
virt = { git = "https://gitlab.com/libvirt/libvirt-rust.git", rev = "0bd0cbffce4dd914e76d74e4de480bf95fabdc98" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# argon2 in an unoptimized build takes about 0.3 s per hash, and the tests
# hash often, so most slow tests waited on it. Optimizing only the argon2
# crates makes each hash about 17 times faster. Lodger's own code stays
# unoptimized, for debugging and coverage.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Lints ported from podspine. Every crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
# Identifiers in doc comments must have backticks.
doc_markdown = "warn"
# Each `unsafe` block must have a `// SAFETY:` comment. Lodger allows `unsafe`
# only in crates/lodger-virt/src/events/ffi.rs and stats/ffi.rs (a CI guard
# enforces the places); this lint enforces the justification.
undocumented_unsafe_blocks = "warn"

[workspace.lints.rustdoc]
# Each [`item`] link in doc comments must resolve. Fires only under `cargo doc`
# (the "Docs (deny warnings)" CI step), not under clippy.
broken_intra_doc_links = "deny"
# The CI doc step passes `--document-private-items` because this workspace is a
# binary, not a library. Links from public items to private items are therefore
# valid and stay clickable.
private_intra_doc_links = "allow"
