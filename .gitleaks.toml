# Gitleaks configuration. The `secret scan` job in .github/workflows/security.yml
# reads it from the repository root. A pull request or push run scans the new
# commits, and the weekly run scans the full history.
#
# The allowlist holds only fake values from tests, each matched exactly.
# `0123456789abcdef0123456789abcdef` is the fake setup token in the Debug-output
# test of crates/lodger/src/setup.rs. The generic-api-key rule matches it
# because the field is named `token`.
[extend]
useDefault = true

[allowlist]
description = "Fake values in tests"
regexes = ['''^0123456789abcdef0123456789abcdef$''']
