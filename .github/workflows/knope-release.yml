name: Knope Release

# knope's "publish" half, ported from scratchsmith (TAD 6.3). When the
# `chore: prepare release X.Y.Z` PR (opened by knope-prepare.yml from the
# `release` branch) merges, this workflow:
#
# 1. builds the archive and runs every release gate through release-build.yml
#    (Rocky 9 build, glibc and libvirt symbol limits, a start on 7 distributions);
# 2. makes CycloneDX SBOMs of the Cargo and the pnpm dependencies (syft over the
#    lockfiles), writes checksums.txt, signs it with keyless cosign, and attests
#    SLSA build provenance;
# 3. stages the signed set in dist/release-assets/, fails closed if a file is
#    missing, and only then runs `knope release`. With `assets` in knope.toml,
#    knope creates the GitHub Release as a draft, uploads every asset, and then
#    publishes it. The tag appears at publish, so no release is ever visible
#    without its assets.
#
# GATED behind the `KNOPE_ENABLED` repo variable. It runs on the merge of the
# release PR (head branch `release`) and tags the squash commit on main.
#
# Verifying a published release:
#   gh attestation verify lodger-vX.Y.Z-linux-amd64.tar.gz --repo schubydoo/lodger
#   sha256sum -c checksums.txt
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/schubydoo/lodger/\.github/workflows/knope-release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# checksums.txt lists the archive and both SBOMs, so the one signature and the
# provenance cover all three.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: # manual fallback; run from main once Cargo.toml holds the version

permissions:
  contents: read

concurrency:
  group: knope-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gates
    if: >-
      ${{ vars.KNOPE_ENABLED == 'true'
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.merged == true
               && github.head_ref == 'release')
              || (github.event_name == 'workflow_dispatch'
                  && github.ref == 'refs/heads/main')) }}
    permissions:
      contents: read
    uses: $/.github/workflows/release-build.yml
    with:
      # The squash commit that landed on main carries the bumped Cargo.toml.
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

  release:
    name: Sign, attest, and publish
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # the App token (below) carries contents:write for the publish
      id-token: write # cosign keyless (Fulcio OIDC) and SLSA provenance
      attestations: write # actions/attest-build-provenance
    steps:
      # A tag pushed with GITHUB_TOKEN starts no other workflow, so the publish
      # uses the lodger-ci App (TAD 6.3).
      - name: Mint lodger-ci App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.LODGER_CI_CLIENT_ID }}
          private-key: ${{ secrets.LODGER_CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify App token was minted
        if: ${{ steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::the lodger-ci App token is empty; check LODGER_CI_CLIENT_ID, LODGER_CI_APP_PRIVATE_KEY, and the App installation."
          exit 1
      # The squash commit on main, not the PR head: knope must tag a commit on
      # main. Full history and tags, so knope can compare with the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-linux-amd64
          path: release
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: SBOMs, checksums, and signature
        run: |
          set -euo pipefail
          count=$(find release -name 'lodger-*.tar.gz' | wc -l)
          [ "$count" -eq 1 ] || { echo "::error::expected 1 archive, found ${count}"; exit 1; }
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::cannot read the version from Cargo.toml (got '${version}')"; exit 1 ;;
          esac
          # The binary is stripped, so the SBOMs come from the lockfiles.
          syft scan file:Cargo.lock -o "cyclonedx-json=release/lodger-v${version}-cargo.cdx.json"
          # pnpm 12 writes 2 YAML documents: its own lock first, then the web
          # app's. syft reads only the first, so scan the second one alone.
          mkdir -p sbom-web
          awk 'docs >= 2 { print } /^---$/ { docs++ }' web/pnpm-lock.yaml > sbom-web/pnpm-lock.yaml
          syft scan file:sbom-web/pnpm-lock.yaml -o "cyclonedx-json=release/lodger-v${version}-web.cdx.json"
          # syft exits 0 when it finds nothing, so a hollow SBOM fails here.
          for sbom in release/lodger-*.cdx.json; do
            n=$(jq '.components | length' "$sbom")
            [ "${n:-0}" -gt 0 ] || { echo "::error::$sbom has no components"; exit 1; }
          done
          for want in virt svelte; do
            # -s reads both files together; without it, jq judges only the last.
            jq -e -s --arg n "$want" 'any(.[].components[]; .name == $n)' release/lodger-*.cdx.json >/dev/null \
              || { echo "::error::no SBOM names ${want}"; exit 1; }
          done
          cd release
          sha256sum lodger-*.tar.gz lodger-*.cdx.json > checksums.txt
          cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt --yes
          # Verify what was just signed, so an unreadable bundle never ships.
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/knope-release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/checksums.txt
      - name: Stage the signed assets, fail closed
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE" ] || { echo "::error::no provenance bundle"; exit 1; }
          cp "$BUNDLE" release/lodger.intoto.jsonl
          mkdir -p dist/release-assets
          cp release/lodger-*.tar.gz release/lodger-*.cdx.json release/checksums.txt \
             release/checksums.txt.sigstore.json release/lodger.intoto.jsonl dist/release-assets/
          # knope fails only on a globbed file that vanished, not on one that was
          # never built. This gate makes sure that the release is complete.
          archives=$(find dist/release-assets -name 'lodger-*.tar.gz' | wc -l)
          [ "$archives" -eq 1 ] || { echo "::error::expected 1 archive staged, found ${archives}"; exit 1; }
          sboms=$(find dist/release-assets -name 'lodger-*.cdx.json' | wc -l)
          [ "$sboms" -eq 2 ] || { echo "::error::expected 2 SBOMs staged, found ${sboms}"; exit 1; }
          for f in checksums.txt checksums.txt.sigstore.json lodger.intoto.jsonl; do
            [ -s "dist/release-assets/${f}" ] || { echo "::error::missing staged asset ${f}"; exit 1; }
          done
          echo "staged $(find dist/release-assets -type f | wc -l) assets"
      - name: Install knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          # renovate: datasource=github-releases depName=knope-dev/knope extractVersion=^knope/v(?<version>.+)$
          version: 0.23.0
      # knope creates the draft, uploads dist/release-assets/*, and publishes.
      # A re-run after a successful publish does nothing.
      - name: Create and publish the GitHub Release
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
