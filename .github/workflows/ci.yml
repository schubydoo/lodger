name: CI

# fmt + clippy + rustdoc + typos, the test suite, an MSRV build, coverage with a
# line floor, and a supply-chain audit. Ported from scratchsmith, with Lodger's differences:
# every cargo job installs libvirt-dev (the virt crate links libvirt), the
# toolchain comes from rust-toolchain.toml, and there is no musl build.
# A single aggregator job, `ci required checks passed`, is what branch
# protection requires. Extend it through `needs`.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt · clippy · docs · typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Spell-check all text, comments included. False positives go in _typos.toml.
      - name: Typos
        uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
      # Lodger keeps every `unsafe` in 2 audited files: the libvirt event glue and
      # the stats call. This fails the moment `unsafe` appears anywhere else in the
      # crates. The CSP keywords 'unsafe-inline' and 'unsafe-eval' do not count: a
      # quote before or a hyphen after the word never follows the Rust keyword.
      - name: unsafe only in events/ffi.rs and stats/ffi.rs
        run: |
          set -euo pipefail
          hits=$(grep -rnwP "(?<!')unsafe(?!-)" crates --include='*.rs' \
            | grep -vE '^crates/lodger-virt/src/(events|stats)/ffi\.rs:' || true)
          if [ -n "$hits" ]; then
            echo "::error::unsafe is allowed only in crates/lodger-virt/src/events/ffi.rs and stats/ffi.rs"
            echo "$hits"
            exit 1
          fi
      - name: Install libvirt-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config
      # No `toolchain:` input: the action reads rust-toolchain.toml (Rust 1.98.1).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          rustflags: ""
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The only step that fires rustdoc lints (broken intra-doc links, bad code blocks).
      - name: Docs (deny warnings)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Prove the workspace still builds on its declared MSRV (Cargo.toml rust-version),
    # not just on the pinned toolchain. `cargo +1.95.0` overrides rust-toolchain.toml.
    name: build (MSRV 1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libvirt-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.95.0
          rustflags: ""
          build-warnings: warn
      - run: cargo +1.95.0 build --workspace --all-features

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libvirt-dev brings the libvirt client library, which also runs the
      # in-process test driver (test:///default). No libvirt daemon is needed.
      - name: Install libvirt-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      # nextest instead of `cargo test`: the same gate, plus a junit.xml (the ci
      # profile in .config/nextest.toml) for Codecov Test Analytics later.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest
      - name: Test (nextest)
        run: cargo nextest run --workspace --all-features --profile ci
      # nextest does not run doctests. Run them separately (reuses the build cache).
      - name: Doctests
        run: cargo test --workspace --all-features --doc
      # Non-blocking, tokenless (public repo). Uploads even on failure (nextest
      # writes junit.xml before exiting non-zero), which is when analytics matter.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/nextest/ci/junit.xml
          disable_search: true
          report_type: test_results
          flags: rust
          fail_ci_if_error: false

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libvirt-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
          rustflags: ""
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-llvm-cov
      # Enforce the line floor and emit lcov. cargo-llvm-cov writes lcov.info before
      # the threshold check, so the upload still runs on a floor failure.
      # The thin process entry (main.rs) and the one unsafe FFI module are excluded
      # from the floor and from Codecov (codecov.yml `ignore:`). An integration test
      # still runs the binary, and the FFI module gets its own sanitizer stress test.
      - name: Coverage (lcov + line floor)
        run: >-
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
          --fail-under-lines 90
          --ignore-filename-regex 'crates/lodger/src/main\.rs|crates/lodger-virt/src/events/ffi\.rs'
      - name: Upload to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false

  supply-chain:
    name: audit · deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check

  web:
    # The SvelteKit app in web/: lint (prettier + eslint), svelte-check, vitest with
    # coverage, the static build, and pnpm's audits. pnpm comes from the
    # `packageManager` field in web/package.json, Node from .node-version.
    name: web · lint · check · test · build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Codecov Bundle Analysis needs more than one commit of history.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint (prettier + eslint)
        run: pnpm run lint
      - name: svelte-check
        run: pnpm run check
      # The junit report feeds Codecov Test Analytics under the `ui` flag.
      - name: Test with coverage
        run: >-
          pnpm run test:coverage --reporter=default --reporter=junit
          --outputFile.junit=test-results/junit.xml
      # The Rust part of /third-party-notices.txt. cargo-about fails on a
      # license outside about.toml; the web build fails on one outside
      # web/notices.ts. cargo reads the toolchain from rust-toolchain.toml.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-about@0.9.2
      - name: Generate the Rust notices
        working-directory: .
        run: cargo about generate about.hbs -o web/notices/rust.txt
      - name: Build
        run: pnpm run build
      # Task 1.11: the notices must name the LGPL and MPL parts.
      - name: Check the notices file
        run: |
          set -euo pipefail
          f=build/third-party-notices.txt
          for want in 'virt 0.' 'virt-sys 0.' '@novnc/novnc ' 'LGPL-2.1' 'MPL-2.0' 'Rust crate notices'; do
            grep -qF -- "$want" "$f" || { echo "::error::$f does not mention $want"; exit 1; }
          done
      # Fails on a high or critical advisory. Lower severities show in the log.
      - name: Audit
        run: pnpm audit --audit-level high
      - name: Verify registry signatures
        run: pnpm audit signatures
      - name: Upload UI coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: web/coverage/lcov.info
          disable_search: true
          flags: ui
          fail_ci_if_error: false
      # Uploads even on failure, like the Rust test results in the `test` job.
      - name: Upload UI test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: web/test-results/junit.xml
          disable_search: true
          report_type: test_results
          flags: ui
          fail_ci_if_error: false

  e2e:
    # Playwright flows and axe on the debug server with libvirt's test driver
    # (Task 3.11): setup, login, the VM list, lifecycle actions, and pool
    # creation, each with the keyboard alone.
    name: e2e · axe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libvirt-dev
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The web build needs the Rust part of the notices, like the web job.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-about@0.9.2
      - name: Generate the Rust notices
        working-directory: .
        run: cargo about generate about.hbs -o web/notices/rust.txt
      - name: Build the web app
        run: pnpm run build
      # A debug build serves web/build from disk.
      - name: Build the server
        working-directory: .
        run: cargo build -p lodger
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the flows
        run: pnpm run test:e2e
      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/tests/playwright-report
            web/tests/test-results
            web/tests/.state/server.log
          retention-days: 7

  ci-required-checks:
    # The single status that branch protection requires. Add new required jobs to needs.
    name: ci required checks passed
    if: always()
    needs: [lint, msrv, test, coverage, supply-chain, web, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed."
