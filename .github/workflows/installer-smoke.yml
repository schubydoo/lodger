name: installer smoke

# Tests install.sh against the latest published release (Task 3.14).
#
# `tamper` runs on the runner: it serves tampered copies of the release from a
# local mirror, and install.sh must stop before anything is installed.
#
# `smoke` runs install.sh inside Debian 13, Ubuntu 24.04, and Rocky 9 with
# systemd as PID 1, because `lodger install` creates a system user and starts
# a systemd service. Those containers must be privileged. That is safe only on
# a GitHub-hosted runner, which is a throwaway VM: never run this job's
# containers on a real host, where a privileged systemd container can take
# over the console.

on:
  pull_request:
    paths:
      - install.sh
      - .github/workflows/installer-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tamper:
    name: tampered release stops install.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck install.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Mirror the latest release, then tamper with it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "TAG=$tag" >>"$GITHUB_ENV"
          mkdir -p mirror/good
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir mirror/good \
            --pattern "lodger-$tag-linux-amd64.tar.gz" --pattern checksums.txt \
            --pattern checksums.txt.sigstore.json
          archive="lodger-$tag-linux-amd64.tar.gz"
          # The archive changes, and checksums.txt still names the real one.
          cp -r mirror/good mirror/archive
          printf x >>"mirror/archive/$archive"
          # The archive changes, and checksums.txt matches it: only the
          # signature can catch this.
          cp -r mirror/archive mirror/sums
          (cd mirror/sums && { sha256sum "$archive"; grep -v " $archive\$" checksums.txt; } >sums.new && mv sums.new checksums.txt)
          # The same, without the signature bundle: a missing bundle must stop
          # the install too, not skip the signature check.
          cp -r mirror/sums mirror/nobundle
          rm mirror/nobundle/checksums.txt.sigstore.json
      - name: Each tampered mirror stops the install
        run: |
          set -euo pipefail
          for case in archive sums nobundle; do
            python3 -m http.server 8999 --bind 127.0.0.1 --directory "mirror/$case" >/dev/null 2>&1 &
            server=$!
            sleep 1
            # pipefail makes the pipeline fail when install.sh fails. sudo
            # resets PATH, so pass it on: root must find cosign too.
            if sudo env PATH="$PATH" VERSION="$TAG" LODGER_BASE_URL=http://127.0.0.1:8999 bash install.sh 2>&1 | tee "out-$case.txt" >/dev/null; then
              cat "out-$case.txt"
              echo "::error::install.sh accepted the tampered mirror '$case'"
              exit 1
            fi
            kill "$server"
            cat "out-$case.txt"
            if [ -e /usr/local/bin/lodger ] || [ -e /etc/systemd/system/lodger.service ]; then
              echo "::error::install.sh installed something from the tampered mirror '$case'"
              exit 1
            fi
          done
          grep -q "checksum verification failed" out-archive.txt
          grep -q "cosign signature verification FAILED" out-sums.txt
          grep -q "could not fetch the signature bundle" out-nobundle.txt
          echo "All 3 tampered mirrors stopped install.sh before any install." >>"$GITHUB_STEP_SUMMARY"

  smoke:
    name: install.sh on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: "debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c"
            setup: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              systemd systemd-sysv libvirt-daemon-system curl ca-certificates
          - name: Ubuntu 24.04
            image: "ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3"
            setup: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              systemd systemd-sysv libvirt-daemon-system curl ca-certificates
          - name: Rocky 9
            image: "rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f"
            # The image ships curl-minimal, which conflicts with the curl
            # package and already provides the curl command.
            # libvirt-daemon-kvm brings the storage and network drivers that
            # Lodger needs, as on a real KVM host.
            setup: >-
              dnf install -y systemd libvirt-daemon libvirt-daemon-kvm
              libvirt-daemon-config-network ca-certificates tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build the image with systemd and libvirt
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
        run: |
          set -euo pipefail
          printf 'FROM %s\nRUN %s\nCMD ["/sbin/init"]\n' "$IMAGE" "$SETUP" >Dockerfile.smoke
          docker build -q -t lodger-smoke -f Dockerfile.smoke .
      - name: Boot it with systemd as PID 1
        run: |
          set -euo pipefail
          docker run -d --name smoke --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock lodger-smoke
          # systemctl fails until systemd opens its socket, so wait for it.
          for _ in $(seq 60); do
            docker exec smoke test -S /run/systemd/private && break
            sleep 1
          done
          # "degraded" is fine: a container lacks some hardware units.
          docker exec smoke systemctl is-system-running --wait || true
          docker exec smoke sh -c 'systemctl enable --now libvirtd.socket 2>/dev/null || systemctl enable --now virtqemud.socket'
          docker exec smoke sh -c 'ls /run/libvirt/'
      - name: Run install.sh like a user would
        run: |
          set -euo pipefail
          docker cp install.sh smoke:/install.sh
          docker cp "$(command -v cosign)" smoke:/usr/local/bin/cosign
          docker exec smoke sh -c 'cat /install.sh | bash'
      - name: Check the service
        run: |
          set -euo pipefail
          docker exec smoke systemctl is-active lodger
          # /api/health answers 200 while libvirt is down too, so read the body.
          # Lodger connects in the background after the start, so wait for it.
          for _ in $(seq 30); do
            health=$(docker exec smoke curl -fsS http://127.0.0.1:8460/api/health)
            grep -q '"libvirt":"connected"' <<<"$health" && break
            sleep 1
          done
          echo "$health"
          grep -q '"libvirt":"connected"' <<<"$health"
          # doctor also checks the host, and a stock Debian fails its AppArmor
          # vhost check, which `lodger doctor` itself tells the user to fix. So
          # the job needs only the checks that the install controls.
          docker exec smoke lodger doctor | tee doctor.txt || true
          grep -q "PASS  libvirt connection" doctor.txt
          grep -q "PASS  libvirt group" doctor.txt
          docker exec smoke sh -c 'lodger version' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Show the logs on failure
        if: ${{ failure() }}
        run: |
          docker exec smoke journalctl -u lodger --no-pager -n 50 || true
          docker exec smoke systemctl --failed || true
