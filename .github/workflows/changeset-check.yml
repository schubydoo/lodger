name: Changeset check

# Advisory, NON-BLOCKING nudge for the changesets-only release model, ported from
# scratchsmith. A PR that changes product code (crates/**/*.rs or web/src/**) but
# adds no `.changeset/*.md` fragment gets a sticky comment + a warning annotation.
# It never fails the job, so it cannot block a merge. Opt out per-PR with the
# `no-changelog` label (CI / refactor / tests / non-user-facing docs).
# Unlike scratchsmith, this is NOT gated on KNOPE_ENABLED: Lodger keeps releases
# off until its signed pipeline exists, but fragments should accumulate from the
# first code change, so the reminder runs from day one.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write # post/update the advisory sticky comment

# No `concurrency` block, on purpose. Renovate opens a PR and labels it within
# seconds, and a cancelled run stays on the head commit as a `cancelled` check
# run. Renovate's own automerge reads that as pending, with no time limit. The
# runs take seconds, so they all finish, and each one reads the PR's current
# labels (not the event payload), so the finishing order does not matter.

jobs:
  changeset:
    # Same-repo PRs only; never on knope's own release PR (it deletes changesets).
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
          && github.head_ref != 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Optional App token for a larger API budget. Soft-fail → GITHUB_TOKEN.
      - name: Mint lodger-ci App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.LODGER_CI_CLIENT_ID }}
          private-key: ${{ secrets.LODGER_CI_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- changeset-check -->';
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: context.payload.pull_request.number,
              });
              // No early return for the label: a run that read the PR before the
              // label landed can post the warning, and this run must clear it.
              const optedOut = (pr.labels || []).some(l => l.name === 'no-changelog');
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const hasChangeset = files.some(f => /^\.changeset\/.+\.md$/.test(f.filename));
              const touchesCode = files.some(f =>
                (f.filename.startsWith('crates/') && f.filename.endsWith('.rs'))
                || f.filename.startsWith('web/src/'));

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const existing = comments.find(c => (c.body || '').includes(marker));

              if (touchesCode && !hasChangeset && !optedOut) {
                const body = [
                  marker,
                  '⚠️ **No changeset found.** This PR changes product code but adds no `.changeset/*.md` fragment.',
                  '',
                  'Lodger releases are changesets-only: a user-facing change needs a fragment, or it ships with',
                  '**no changelog entry and no version bump**. Add one — run `knope document-change`, or commit a',
                  '`.changeset/<slug>.md` with front-matter `default: patch|minor|major|perf|security` and a one-line',
                  'summary (see `CONTRIBUTING.md`). Internal-only PRs (CI, refactor, tests, non-user-facing docs) can add the',
                  '**`no-changelog`** label instead.',
                  '',
                  '_Advisory only — this check never blocks the merge._',
                ].join('\n');
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                }
                core.warning('PR changes product code without a changeset — add one or apply the no-changelog label.');
              } else if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: optedOut
                    ? `${marker}\n✅ The \`no-changelog\` label is set — no changeset needed.`
                    : `${marker}\n✅ Changeset present (or no code change) — thanks!`,
                });
              }
            } catch (err) {
              core.warning(`changeset check skipped: ${err.message}`);
            }
