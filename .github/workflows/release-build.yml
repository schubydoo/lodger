name: Release Build

# Builds the Lodger release archive and runs the release gates (TAD 6.3). It
# signs and publishes nothing. knope-release.yml calls it before it signs and
# publishes a release. A pull request that changes the release build runs it
# as a dry run, so a broken build shows up before a release needs it.
#
# 1. `web` builds the web UI with its third-party notices.
# 2. `binary` builds lodger in rockylinux/rockylinux:9, whose glibc 2.34 is the
#    floor, and runs the symbol gate: GLIBC_ 2.34 or lower, LIBVIRT_ 9.0.0 or
#    lower. It packages the archive.
# 3. `start` starts the binary on each of the 7 tested distributions.
#
# The scripts in scripts/release/ run the same steps on a developer machine.
# Every container is a plain `docker run` with the checkout mounted.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/release-build.yml
      - scripts/release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event_name }}-${{ inputs.ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every image is pinned by digest. The lodger.json preset in
# schubydoo/renovate-config tracks each `<image>:<tag>@sha256:<digest>` here.
env:
  ROCKY_IMAGE: rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f

jobs:
  web:
    name: web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      # The Rust part of /third-party-notices.txt, like the web job in ci.yml.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - name: Generate the Rust notices
        run: cargo about generate about.hbs -o web/notices/rust.txt
      - name: Build
        working-directory: web
        run: pnpm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: web/build
          if-no-files-found: error
          retention-days: 1

  binary:
    name: binary (Rocky 9) and symbol gate
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: web/build
      - name: Build in Rocky 9, then check the symbols
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -e HOST_UID="$(id -u)"
          "$ROCKY_IMAGE" scripts/release/build.sh
      # Outside the container, which has no step summary to write to.
      - name: Check the binary size
        run: scripts/release/check-size.sh target/release/lodger
      - name: Package the archive
        run: |
          set -euo pipefail
          # The version from the [workspace.package] line of Cargo.toml, which
          # knope bumps. It names the archive after the tag (v<version>).
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::cannot read the version from Cargo.toml (got '${version}')"; exit 1 ;;
          esac
          pkg="lodger-v${version}-linux-amd64"
          mkdir -p "dist/${pkg}"
          cp target/release/lodger LICENSE web/build/third-party-notices.txt "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-amd64
          path: dist/lodger-*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1

  start:
    name: start on ${{ matrix.name }}
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian 12, image: "debian:12@sha256:854dd8ab51d62866dbd8f5431d15ce77b12983a2a4a1e1fe43a2395dc7ef9f61" }
          - { name: Debian 13, image: "debian:13@sha256:8c4733a92aacd0bcff3779eadc35a4a5147f36cb20a5fcb56504cbc740212259" }
          - { name: Ubuntu 24.04, image: "ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c" }
          - { name: Fedora 44, image: "fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80" }
          - { name: Rocky 9, image: "rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f" }
          - { name: Rocky 10, image: "rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834" }
          - { name: Arch, image: "archlinux:base@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-amd64
          path: dist
      - name: Unpack the archive
        run: tar -C dist -xzf dist/lodger-*-linux-amd64.tar.gz
      - name: Start lodger
        env:
          IMAGE: ${{ matrix.image }}
        run: scripts/release/smoke-in.sh "$IMAGE" dist/lodger-*-linux-amd64/lodger
