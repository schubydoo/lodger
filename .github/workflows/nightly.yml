name: Nightly

# Slow checks that do not run on every pull request (TAD section 9.3).
# Today: the 2 `unsafe` files (the libvirt event glue and the stats call) under
# AddressSanitizer. The real-VM tests with KVM join this file later.
#
# The AddressSanitizer job also runs on each pull request that changes either
# file, because every change to `unsafe` code needs the stress tests.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    # The glue, the code that registers it and drops it, the dependency versions
    # (the `virt` pin and tokio), and this job's own files.
    paths:
      - crates/lodger-virt/src/events/**
      - crates/lodger-virt/src/stats/**
      - crates/lodger-virt/src/conn.rs
      - Cargo.lock
      - .github/workflows/nightly.yml
      - .github/lsan-suppressions.txt

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  asan:
    # 10,000 domain events through the FFI trampolines, with handles that open
    # and drop on the way, so registration and libvirt's free callback run many
    # times. Then 2,000 stats calls, with a domain that starts and stops on the
    # way, so the record copy and the list free run many times. AddressSanitizer
    # needs nightly Rust and a std built with it (`-Zbuild-std`). The test driver
    # runs in process, so no libvirtd is needed.
    name: unsafe code under AddressSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # llvm brings llvm-symbolizer. Without it, the leak report has no function
      # names, and the `leak:virClassNew` suppression cannot match.
      - name: Install libvirt-dev and llvm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config llvm
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          components: rust-src
          rustflags: ""
          build-warnings: warn
      - name: Stress tests under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          # One known leak inside libvirt itself. The file explains it.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
        run: >-
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p lodger-virt -- --exact events::tests::stress_ten_thousand_events
          stats::tests::stress_two_thousand_stats_calls
