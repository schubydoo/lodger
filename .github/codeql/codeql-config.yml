# CodeQL configuration, read by .github/workflows/codeql.yml.
#
# `rust/hard-coded-cryptographic-value` treats every string that reaches a
# password parameter as a hard-coded secret. In Lodger, all 28 of its alerts
# on 2026-09-24 were fixed test passwords: 25 in `#[cfg(test)]` modules and 3
# in crates/lodger/tests/binary.rs. The main ruleset's CodeQL gate blocks a
# pull request on a new critical alert, so every test that used a test
# password in a new place blocked its pull request. Rust keeps unit tests in
# the source files, so `paths-ignore` cannot leave out only the tests.
#
# gitleaks (security.yml) still scans every commit for real secrets, and the
# review rules forbid a secret in any log or file.
query-filters:
  - exclude:
      id: rust/hard-coded-cryptographic-value
