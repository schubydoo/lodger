# cargo-about: the licenses of the Rust crates that ship in the lodger binary.
# `just notices` (and CI) runs `cargo about generate about.hbs`. Keep `accepted`
# in step with the [licenses] allow list in deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "LGPL-2.1",
]
# Only what is linked into the binary: test-only and build-time crates do not
# ship.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Lodger's own crates (publish = false) are not third-party.
private = { ignore = true }
# The binary is built for Linux only.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
