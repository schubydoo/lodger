# Codecov config, ported from scratchsmith. Coverage is REPORTED here for
# visibility (PR comment, trend graphs, per-crate breakdown). The REAL gate is the
# CI line floor in .github/workflows/ci.yml (the `coverage` job runs
# `cargo llvm-cov --fail-under-lines 90`). Tokenless (public repo).
#
# Lodger difference: two test suites, kept apart by flag. `rust` carries the
# cargo-llvm-cov lcov and the nextest junit from the `coverage` and `test` jobs.
# `ui` carries the Vitest lcov and junit from the `web` job. Each suite has its
# own project status, patch status, component, and Test Analytics flag. Both
# suites upload on every commit, so no flag needs carryforward. Validate with:
#   curl -X POST --data-binary @codecov.yml https://api.codecov.io/validate

codecov:
  # ci.yml uploads coverage even when the floor step fails (`!cancelled()`), so a
  # drop surfaces exactly when a change breaks the floor. Do not gate on CI.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false
    after_n_builds: 2 # one coverage upload per suite: rust and ui

coverage:
  precision: 2
  round: down # a strict floor rounds down, matching the CI --fail-under-lines gate
  range: "88...96"
  status:
    project:
      default:
        target: 90% # mirror the ci.yml line floor
        threshold: 1%
        informational: true # a nudge, never a block; ci.yml is the source of truth
        flags: [rust]
      ui:
        target: auto
        informational: true
        flags: [ui]
    patch:
      default:
        target: 80% # new-code (diff) coverage
        threshold: 0%
        informational: false # a red/green signal (still a non-required check)
        if_not_found: success # docs-only PRs upload no diff; do not block them
        flags: [rust]
      ui:
        target: 80% # the same bar for new web code
        threshold: 0%
        informational: false
        if_not_found: success
        flags: [ui]

flags:
  rust:
    paths:
      - crates/
  ui:
    paths:
      - web/src/

# The thin process entry and the one unsafe FFI module are excluded here and from
# the CI floor (see the coverage job in ci.yml).
#
# The web UI also leaves out the shadcn-svelte code copied from upstream and
# the test helpers. web/vite.config.ts excludes the same paths from the lcov.
# The web lcov is written from inside web/, so its paths start with src/.
# Codecov maps them to web/src/ on its own today; this fix makes that mapping
# explicit, so it does not depend on a guess. The Rust lcov has absolute
# paths, which never start with src/.
fixes:
  - "src/::web/src/"

# Bundle Analysis for the web app (the Codecov SvelteKit plugin in
# web/vite.config.ts). Informational: a size change shows in the PR comment
# and in a status that never fails.
bundle_analysis:
  warning_threshold: "5%"
  status: "informational"

ignore:
  - "crates/lodger/src/main.rs"
  - "crates/lodger-virt/src/events/ffi.rs"
  - "web/src/lib/components/ui/**/*"
  - "web/src/lib/test/**/*"

github_checks:
  annotations: false # per-line PR annotations are clutter; the comment carries the signal

comment:
  layout: "condensed_header, diff, flags, components, files"
  after_n_builds: 2 # wait for both suites, so the comment never shows half the data
  behavior: default
  require_changes: true # only comment when coverage actually moves
  hide_project_coverage: false

# Per-crate coverage breakdown. IMPORTANT: paths are EXPLICIT FILES, not globs.
# Codecov's component matcher silently ignores `**` globs here (the component
# renders empty even at 100%), whereas explicit file paths match. Add each new
# `.rs` file to its crate's list when it appears. Files in `ignore:` above match
# nothing, so they are left out.
component_management:
  individual_components:
    - component_id: lodger-core
      name: lodger-core (XML, seed disks, input checks)
      paths:
        - crates/lodger-core/src/lib.rs
        - crates/lodger-core/src/model/host.rs
        - crates/lodger-core/src/model/mod.rs
        - crates/lodger-core/src/model/network.rs
        - crates/lodger-core/src/model/pool.rs
        - crates/lodger-core/src/model/snapshot.rs
        - crates/lodger-core/src/model/vm.rs
        - crates/lodger-core/src/model/volume.rs
        - crates/lodger-core/src/validate.rs
    - component_id: lodger-virt
      name: lodger-virt (libvirt adapter)
      paths:
        - crates/lodger-virt/src/lib.rs
        - crates/lodger-virt/src/cache.rs
        - crates/lodger-virt/src/conn.rs
        - crates/lodger-virt/src/console.rs
        - crates/lodger-virt/src/events/mod.rs
        - crates/lodger-virt/src/supervisor.rs
    - component_id: lodger
      name: lodger (server, web assets, CLI)
      paths:
        - crates/lodger/src/api.rs
        - crates/lodger/src/assets.rs
        - crates/lodger/src/cli.rs
        - crates/lodger/src/config.rs
        - crates/lodger/src/console.rs
        - crates/lodger/src/db/mod.rs
        - crates/lodger/src/db/tests.rs
        - crates/lodger/src/server.rs
        - crates/lodger/src/ws.rs
    # The web UI selects its files by flag, not by path, so no path list needs
    # an update when a Svelte file appears.
    - component_id: web
      name: web (SvelteKit UI)
      flag_regexes:
        - "^ui$"
