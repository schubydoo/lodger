# Codecov config, ported from scratchsmith. Coverage is REPORTED here for
# visibility (PR comment, trend graphs, per-crate breakdown). The REAL gate is the
# CI line floor in .github/workflows/ci.yml (the `coverage` job runs
# `cargo llvm-cov --fail-under-lines 90`). Tokenless (public repo).
#
# Lodger difference: two flags. `rust` carries the Rust coverage from one Linux
# cell. `ui` will carry the SvelteKit coverage once the web app exists, and it is
# informational only. Validate this file with:
#   curl -X POST --data-binary @codecov.yml https://api.codecov.io/validate

codecov:
  # ci.yml uploads coverage even when the floor step fails (`!cancelled()`), so a
  # drop surfaces exactly when a change breaks the floor. Do not gate on CI.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false
    after_n_builds: 1 # single Ubuntu coverage cell

coverage:
  precision: 2
  round: down # a strict floor rounds down, matching the CI --fail-under-lines gate
  range: "88...96"
  status:
    project:
      default:
        target: 90% # mirror the ci.yml line floor
        threshold: 1%
        informational: true # a nudge, never a block; ci.yml is the source of truth
        flags: [rust]
      ui:
        target: auto
        informational: true
        flags: [ui]
    patch:
      default:
        target: 80% # new-code (diff) coverage
        threshold: 0%
        informational: false # a red/green signal (still a non-required check)
        if_not_found: success # docs-only PRs upload no diff; do not block them
        flags: [rust]

flags:
  rust:
    paths:
      - crates/
  ui:
    paths:
      - web/src/
    carryforward: true # a Rust-only PR keeps the last UI number

# The thin process entry and the one unsafe FFI module are excluded here and from
# the CI floor (see the coverage job in ci.yml).
ignore:
  - "crates/lodger/src/main.rs"
  - "crates/lodger-virt/src/events/ffi.rs"

github_checks:
  annotations: false # per-line PR annotations are clutter; the comment carries the signal

comment:
  layout: "condensed_header, diff, flags, components, files"
  behavior: default
  require_changes: true # only comment when coverage actually moves
  hide_project_coverage: false

# Per-crate coverage breakdown. IMPORTANT: paths are EXPLICIT FILES, not globs.
# Codecov's component matcher silently ignores `**` globs here (the component
# renders empty even at 100%), whereas explicit file paths match. Add each new
# `.rs` file to its crate's list when it appears. Files in `ignore:` above match
# nothing, so they are left out.
component_management:
  individual_components:
    - component_id: lodger-core
      name: lodger-core (XML, seed disks, input checks)
      paths:
        - crates/lodger-core/src/lib.rs
    - component_id: lodger-virt
      name: lodger-virt (libvirt adapter)
      paths:
        - crates/lodger-virt/src/lib.rs
        - crates/lodger-virt/src/cache.rs
        - crates/lodger-virt/src/conn.rs
        - crates/lodger-virt/src/events/mod.rs
        - crates/lodger-virt/src/supervisor.rs
    - component_id: lodger
      name: lodger (server, web assets, CLI)
      paths:
        - crates/lodger/src/assets.rs
        - crates/lodger/src/cli.rs
        - crates/lodger/src/server.rs
