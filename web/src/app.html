<!doctype html>
<!-- Dark is the default theme (Schuby's choice). A theme switcher later
     only toggles this class; every color already has a light and a dark value
     in src/routes/layout.css. -->
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Native controls and scrollbars follow the theme. -->
		<meta name="color-scheme" content="dark light" />
		<!-- Scale the root font size with the OS and browser text-size settings (WCAG 1.4.4).
		     From the Svelte CLI template. See MDN: <meta name="text-scale">. -->
		<meta name="text-scale" content="scale" />
		<!-- In the page itself, not added by the app: a browser that finds no icon
		     link before the app runs asks for /favicon.ico, which does not exist. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
